repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: token-budget
        name: file token budget
        entry: uv run --frozen token-budget
        language: system
        types: [text]
        require_serial: true
      - id: crap-score
        name: CRAP score
        entry: uv run --frozen crap-score
        language: system
        types: [python]
        files: ^src/
        require_serial: true
        stages: [manual]
