[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "gateseal-hooks"
version = "0.1.0"
description = "Plain pre-commit hooks, usable with or without gateseal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karsten Evers" }]
keywords = ["pre-commit", "crap", "file-size", "code-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/karstenevers/gateseal-hooks"
Issues = "https://github.com/karstenevers/gateseal-hooks/issues"

[project.scripts]
crap-score-python = "gateseal_hooks.crap.python:main"
token-budget = "gateseal_hooks.token_budget:main"

[dependency-groups]
dev = [
    "coverage==7.17.2",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "pyright==1.1.414",
    "pre-commit==4.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gateseal_hooks"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: installs the hooks with pre-commit in a Git repository"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/gateseal_hooks"]
