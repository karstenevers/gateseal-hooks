- id: token-budget
  name: file token budget
  description: Fail when a file is over the token cap or over its own budget.
  entry: token-budget
  language: python
  types: [text]
  require_serial: true
  always_run: true
- id: crap-score-python
  name: CRAP score (Python)
  description: Fail when a Python function's CRAP score is over the limit. Reads a coverage.py JSON report.
  entry: crap-score-python
  language: python
  types: [python]
  require_serial: true
  stages: [manual]
- id: crap-score-typescript
  name: CRAP score (TypeScript)
  description: Fail when a TypeScript or JavaScript function's CRAP score is over the limit. Runs crap4ts on a coverage report.
  entry: crap4ts --threshold 10 --no-color
  language: node
  additional_dependencies: [crap4ts@1.0.1, typescript@5.9.3]
  pass_filenames: false
  types_or: [ts, tsx, javascript, jsx]
  stages: [manual]
